{% set name = "napari-plugin-manager" %}
{% set version = "0.1.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1a2d4db00cd6379e7a7d531c05f6718e1254898bcd71d08a6179f65ae3d2bb76

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - setuptools-scm >=3.4
    - pip
  run:
    - python >={{ python_min }}
    - npe2
    - qtpy
    - superqt
    - pip
    - napari >=0.4.18

test:
  imports:
    - napari_plugin_manager
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/napari/napari-plugin-manager
  summary: Install plugins for napari, in napari.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - conda-forge/napari
    - DragaDoncila
    - jni
    - czaki
    - jaimergp
